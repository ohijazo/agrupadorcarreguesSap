# =============================================================================
# Apache VirtualHost - Agrupador de Carregues (variant SAP B1)
# =============================================================================
# Desti al servidor: /etc/apache2/sites-available/agrupacio-carregues-sap.conf
# Activar amb: sudo a2ensite agrupacio-carregues-sap.conf && sudo systemctl reload apache2
#
# Conviu amb la variant Kais (agrupacions.agrienergia.local -> port 50004).
# Aquesta serveix agrupacions-sap.agrienergia.local -> port 50006.
# Cal una entrada DNS nova al servidor DNS corporatiu apuntant a
# ae01farwebsrv.agrienergia.local (192.168.11.244).
# =============================================================================

<VirtualHost *:80>
    ServerName agrupacions-sap.agrienergia.local

    # CRITIC: els carrega_id porten barres (format EJE/SCA/CAR, p.ex.
    # 2026/01/0002266) i viatgen codificats (%2F) dins de la URL. Sense
    # AllowEncodedSlashes NoDecode + nocanon, Apache respon 404.
    AllowEncodedSlashes NoDecode

    # Headers de seguretat (mateix joc que la variant Kais)
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin"

    ProxyPreserveHost On
    ProxyPass        /static/ !
    ProxyPass        / http://127.0.0.1:50006/ nocanon
    ProxyPassReverse / http://127.0.0.1:50006/

    # Servir els estatics directament (no passen per Gunicorn)
    Alias /static/ /var/www/agrupacio-carregues-sap/static/
    <Directory /var/www/agrupacio-carregues-sap/static/>
        Require all granted
        Options -Indexes
        ExpiresActive On
        ExpiresDefault "access plus 7 days"
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/agrupacio-carregues-sap-error.log
    CustomLog ${APACHE_LOG_DIR}/agrupacio-carregues-sap-access.log combined
</VirtualHost>
